apiVersion: v1
kind: Pod
metadata:
  name: imgvol-test
spec:
  containers:
  - name: shell
    image: busybox:1.36
    command: ["sleep", "3600"]
    volumeMounts:
    - name: art
      mountPath: /mnt/art
  volumes:
  - name: art
    image:
      reference: busybox:1.36
      pullPolicy: IfNotPresent