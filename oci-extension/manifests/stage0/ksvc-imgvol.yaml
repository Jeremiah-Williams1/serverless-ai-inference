apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: imgvol-ksvc
spec:
  template:
    spec:
      containers:
      - image: busybox:1.36
        command: ["sleep", "3600"]
        volumeMounts:
        - name: art
          mountPath: /mnt/art
          readOnly: true
      volumes:
      - name: art
        image:
          reference: alpine:3.20
          pullPolicy: IfNotPresent